name: Refresh AI repository catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_catalog.py"
      - "AI_KNOWLEDGE_BASE.md"
      - ".github/workflows/refresh-catalog.yml"
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate public owned/starred catalog
        env:
          GITHUB_TOKEN: ${{ secrets.MY_AI_GITHUB_TOKEN || github.token }}
          MY_AI_GITHUB_OWNER: pedrograd
        run: python scripts/refresh_catalog.py

      - name: Commit changes
        run: |
          if git diff --quiet -- generated/github_catalog.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/github_catalog.json
          git commit -m "chore: refresh AI repository catalog"
          git push
